services:
  - type: web
    name: 6native-tailor
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://6native-tailor-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: 6native-tailor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: 0.5c-512mb
    disk:
      name: application-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 6native-tailor-db
          property: connectionString
      - key: CUSTOMER_SESSION_SECRET
        generateValue: true
      - key: CUSTOMER_COOKIE_SECURE
        value: "true"
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://6native-tailor.onrender.com
      - key: MEDIA_DIRECTORY
        value: /var/data/media
      - key: CERTIFICATE_DIRECTORY
        value: /var/data/certificates
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

databases:
  - name: 6native-tailor-db
    databaseName: 6native
    user: 6native
    plan: 0.1c-256mb
    diskSizeGB: 1
